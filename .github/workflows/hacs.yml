name: HACS validation

# Gated like the rest of the org's workflows: pushes do not start hosted runs.
# Dispatch it when you want a run:
#   gh workflow run hacs.yml --repo companionintelligence/CI-Home-Assistant-Voice-PE --ref <branch>
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
