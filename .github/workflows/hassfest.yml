name: hassfest validation

# Gated like the rest of the org's workflows: pushes do not start hosted runs.
# Dispatch it when you want a run:
#   gh workflow run hassfest.yml --repo companionintelligence/CI-Home-Assistant-Voice-PE --ref <branch>
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hassfest validation
        uses: home-assistant/actions/hassfest@master
